[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quanticdata-yahoo-finance-scraper"
version = "0.1.0"
description = "Yahoo Finance scraper for Python and the command line: live quotes for stocks, ETFs, indices and currency pairs with price, change, volume, day and 52-week range, plus OHLCV price history, as JSON or CSV. Free and open source; sign in with your QuanticData account, no proxies or headless browser to run."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "QuanticData", email = "hello@quanticdata.io" }]
keywords = ["yahoo-finance-scraper", "yahoo-finance", "yahoo-finance-api", "stock-data", "stock-api", "stock-market", "stock-prices", "stock-quotes", "historical-data", "ohlcv", "market-data", "financial-data"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3"]

[project.scripts]
yahoo-finance-scraper = "quanticdata_yahoo_finance_scraper.__main__:run"

[project.urls]
Homepage = "https://quanticdata.io/collectors/stock-data-api/?utm_source=github&utm_medium=pypi&utm_campaign=yahoo-finance-scraper"
Documentation = "https://quanticdata.io/docs/"
Source = "https://github.com/quantumproxies/yahoo-finance-scraper"
Issues = "https://github.com/quantumproxies/yahoo-finance-scraper/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quanticdata_yahoo_finance_scraper" = ["spec.json", "py.typed"]
